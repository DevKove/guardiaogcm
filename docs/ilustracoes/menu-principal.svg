<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620"><rect width="900" height="620" rx="24" fill="#e2e8f0"/><rect x="25" y="25" width="245" height="570" rx="18" fill="#0f172a"/><text x="50" y="70" fill="#fff" font-family="Arial" font-size="24" font-weight="700">GUARDIÃO GCM</text><g font-family="Arial" font-size="18" fill="#e2e8f0"><text x="55" y="125">▣ Painel</text><text x="55" y="170">● Ocorrências</text><text x="55" y="215">＋ Nova</text><text x="55" y="260">▰ Viaturas</text><text x="55" y="305">♟ Equipe</text><text x="55" y="350">⌖ Postos fixos</text><text x="55" y="395">▤ Relatórios</text><text x="55" y="440">▥ Histórico</text><text x="55" y="485">◷ Plantão</text><text x="55" y="530">▣ Itens</text><text x="55" y="575">⚙ Usuários*</text></g><rect x="300" y="25" width="575" height="570" rx="18" fill="#fff"/><text x="335" y="85" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Como navegar</text><text x="335" y="135" font-family="Arial" font-size="19" fill="#334155">• Ocorrências: atendimento e despacho.</text><text x="335" y="180" font-family="Arial" font-size="19" fill="#334155">• Plantão: acompanhamento operacional.</text><text x="335" y="225" font-family="Arial" font-size="19" fill="#334155">• Itens: armas, rádios e CAD.</text><text x="335" y="270" font-family="Arial" font-size="19" fill="#334155">• Histórico: consultas e relatórios.</text><text x="335" y="315" font-family="Arial" font-size="19" fill="#334155">• Usuários*: administração, conforme perfil.</text><text x="335" y="390" font-family="Arial" font-size="17" fill="#64748b">* Itens e opções podem aparecer ou não</text><text x="335" y="418" font-family="Arial" font-size="17" fill="#64748b">conforme as permissões do usuário.</text></svg>