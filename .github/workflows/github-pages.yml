name: Deploy to GitHub Pages

on:
  push:
    branches:
      - deploy/github-pages
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These are browser-side Supabase values. Configure them as
      # Repository Variables in Settings > Secrets and variables > Actions.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Prepare GitHub Pages fallback
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d ".output/public" ]; then
            echo "ERROR: .output/public was not generated."
            echo "Generated output:"
            find .output -maxdepth 3 -type f 2>/dev/null | head -200 || true
            exit 1
          fi

          if [ -f ".output/public/_shell.html" ]; then
            cp ".output/public/_shell.html" ".output/public/404.html"
          elif [ ! -f ".output/public/index.html" ]; then
            echo "ERROR: Neither _shell.html nor index.html exists in .output/public."
            find .output/public -maxdepth 2 -type f | sort | head -200
            exit 1
          fi

          touch ".output/public/.nojekyll"
          echo "GitHub Pages files:"
          find ".output/public" -maxdepth 2 -type f | sort | head -200

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ".output/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
